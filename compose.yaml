services:
  face-api:
    build:
      context: ./face-service
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      API_KEY: "${FACE_SERVICE_API_KEY:?Set FACE_SERVICE_API_KEY in .env}"
      MODEL_DIR: /models
      MODEL_NAME: buffalo_l
      MODEL_VERSION: insightface-buffalo_l-v1
      MATCH_THRESHOLD: "0.40"
      # Quality thresholds; lower values increase tolerance for weaker laptop cameras.
      MIN_FACE_AREA_RATIO: "0.10"
      MIN_DETECTION_SCORE: "0.75"
      MIN_EMBEDDING_NORM: "9"
      FACE_FRAME_MARGIN_RATIO: "0.025"
      LANDMARK_BBOX_PADDING_RATIO: "0.06"
      ATTENDANCE_MAX_YAW_DEGREES: "18"
      ATTENDANCE_MAX_ROLL_DEGREES: "12"
      MIN_BLUR_VARIANCE: "35"
      MIN_EDGE_SHARPNESS: "8"
      MIN_BRIGHTNESS: "45"
      MAX_BRIGHTNESS: "215"
      MAX_DARK_PIXEL_RATIO: "0.40"
      MAX_BRIGHT_PIXEL_RATIO: "0.40"
      MIN_CONTRAST: "20"
      MIN_REGION_CONTRAST: "8"
      MIN_REGION_BLUR_VARIANCE: "12"
      MIN_REGION_EDGE_SHARPNESS: "3"
      VISIBILITY_MODEL_NAME: landmark_2d_106
      MIN_VISIBILITY_SCORE: "0.78"
      MIN_LANDMARK_INLIER_RATIO: "0.98"
      MIN_LANDMARK_EDGE_SUPPORT: "0.20"
      LIVENESS_METHOD: active_head_pose_v1
      LIVENESS_CENTER_MAX_YAW_DEGREES: "25"
      LIVENESS_CENTER_MAX_DELTA_DEGREES: "12"
      LIVENESS_TURN_MIN_YAW_DEGREES: "18"
      LIVENESS_SAME_FACE_MAX_DISTANCE: "0.45"
      LIVENESS_TURN_SAME_FACE_MAX_DISTANCE: "0.55"
      LIVENESS_MIN_HASH_DISTANCE: "4"
      LEGACY_FACE_ENDPOINTS_ENABLED: "${FACE_LEGACY_ENDPOINTS_ENABLED:-false}"
      OMP_NUM_THREADS: "2"
      ORT_NUM_THREADS: "2"
    volumes:
      - face-models:/models
    mem_limit: 2g
    cpus: 1.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  face-models:
